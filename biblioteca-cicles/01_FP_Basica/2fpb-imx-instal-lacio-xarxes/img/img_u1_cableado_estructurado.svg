<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Verdana, Arial, sans-serif">
<style>
.box { fill:#fff; stroke:#e67e22; stroke-width:2; }
.title { fill:#e67e22; font-weight:bold; }
.text { fill:#222; font-size:14px; }
.small { fill:#555; font-size:11px; }
.arrow { stroke:#e67e22; stroke-width:2; fill:none; marker-end:url(#arr); }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#e67e22"/></marker></defs>

<rect x="30" y="30" width="840" height="700" rx="10" fill="#fff5ea"/>
<text x="60" y="70" class="title" style="font-size:20px">Cableado estructurado (esquema básico)</text>

<g>
<rect x="60" y="100" width="220" height="90" class="box"/>
<text x="85" y="130" class="title">Cuarto de telecomunicaciones</text>
<text x="85" y="152" class="small">Armario rack</text>
<text x="85" y="170" class="small">Patch panel + switch</text>
<rect x="60" y="230" width="220" height="40" class="box"/><text x="80" y="246" class="small">Cable horizontal (UTP Cat 6)</text><text x="80" y="266" class="small">m&#225;x. 90 m</text>

<line x1="190" y1="190" x2="190" y2="230" stroke="#e67e22" stroke-width="2"/>
<path d="M 220 320 Q 420 350 620 320" stroke="#e67e22" stroke-width="2" fill="none"/>
<line x1="220" y1="270" x2="220" y2="340" stroke="#e67e22" stroke-width="2"/>

<rect x="160" y="340" width="120" height="60" class="box"/><text x="180" y="362" class="small">Canaleta /</text><text x="180" y="380" class="small">tubo corrugado</text>
<line x1="220" y1="400" x2="220" y2="460" stroke="#e67e22" stroke-width="2"/>

<rect x="130" y="460" width="160" height="80" class="box"/>
<text x="150" y="488" class="title">Toma de usuario</text>
<text x="150" y="508" class="small">(keystone RJ-45)</text>
<text x="60" y="585" class="small">Cable de conexión (patch cord) del PC a la toma: &#8804; 5 m</text>
<circle cx="140" cy="640" r="26" class="box"/><text x="105" y="693" class="small">PC del alumno</text>
<line x1="158" y1="540" x2="150" y2="620" stroke="#e67e22" stroke-width="2"/>

<rect x="480" y="100" width="300" height="90" class="box"/>
<text x="505" y="130" class="title">Subsistemas del cableado</text>
<text x="505" y="152" class="small">&#8226; Salida de trabajo (tomas)</text>
<text x="505" y="170" class="small">&#8226; Distribuidor (horizontal)</text>
<text x="505" y="188" class="small">&#8226; Campus (vertical/backbone)</text>
<rect x="480" y="230" width="300" height="40" class="box"/><text x="500" y="256" class="small">Switch de piso / distribuidor</text>
<line x1="490" y1="190" x2="490" y2="230" stroke="#e67e22" stroke-width="2" transform="translate(60 0)"/>
<rect x="540" y="300" width="240" height="46" class="box"/><text x="560" y="322" class="small">Red troncal (fibra / UTP) al</text><text x="560" y="340" class="small">distribuidor principal (MDF)</text>
</g>
</svg>