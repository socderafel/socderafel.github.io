<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Verdana, Arial, sans-serif">
<style>
.box { fill:#fff; stroke:#e67e22; stroke-width:2; }
.title { fill:#e67e22; font-weight:bold; }
.text { fill:#222; font-size:14px; }
.small { fill:#555; font-size:11px; }
.arrow { stroke:#e67e22; stroke-width:2; fill:none; marker-end:url(#arr); }
</style>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#e67e22"/></marker></defs>

<rect x="40" y="40" width="820" height="640" rx="10" fill="#fff5ea"/>
<text x="70" y="80" class="title" style="font-size:20px">Cable directo y cable cruzado (T568A / T568B)</text>

<text x="90" y="140" class="text" font-weight="bold">CABLE DIRECTO (paralelo)</text>
<text x="90" y="160" class="small">Mismo estándar en ambos extremos (T568B&#8594;T568B o T568A&#8594;T568A). Une cables y equipos de distinto tipo: PC&#8594;switch, PC&#8594;router, PC&#8594;toma de pared.</text>
<rect x="90" y="175" width="150" height="34" class="box"/><text x="100" y="197" class="small">Conector RJ-45</text>
<line x1="120" y1="209" x2="120" y2="250" stroke="#e67e22" stroke-width="2"/><line x1="190" y1="209" x2="190" y2="250" stroke="#e67e22" stroke-width="2"/>
<rect x="90" y="250" width="150" height="34" class="box"/><text x="100" y="272" class="small">Conector RJ-45</text>
<text x="120" y="312" class="small">1&#8594;1, 2&#8594;2, 3&#8594;3, 6&#8594;6</text>

<text x="470" y="140" class="text" font-weight="bold">CABLE CRUZADO</text>
<text x="470" y="160" class="small">T568A en un extremo y T568B en el otro. Une equipos del mismo tipo: PC&#8594;PC directamente, o switch&#8594;switch.</text>
<rect x="470" y="175" width="150" height="34" class="box"/><text x="480" y="197" class="small">RJ-45 (T568A)</text>
<line x1="500" y1="209" x2="500" y2="250" stroke="#e67e22" stroke-width="2"/><line x1="570" y1="209" x2="570" y2="250" stroke="#e67e22" stroke-width="2"/>
<rect x="470" y="250" width="150" height="34" class="box"/><text x="480" y="272" class="small">RJ-45 (T568B)</text>
<text x="495" y="312" class="small">1&#8596;3, 2&#8596;6, 3&#8596;1, 6&#8596;2</text>

<text x="90" y="360" class="text" font-weight="bold">Identificación de pares T568B</text>
<rect x="90" y="380" width="330" height="220" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
<text x="110" y="400" class="text">1</text><text x="150" y="400" class="small">blanco/naranja   (par 2)</text><text x="110" y="424" class="text">2</text><text x="150" y="424" class="small">naranja            (par 2)</text><text x="110" y="448" class="text">3</text><text x="150" y="448" class="small">blanco/verde     (par 3)</text><text x="110" y="472" class="text">4</text><text x="150" y="472" class="small">azul                (par 1)</text><text x="110" y="496" class="text">5</text><text x="150" y="496" class="small">blanco/azul     (par 1)</text><text x="110" y="520" class="text">6</text><text x="150" y="520" class="small">verde               (par 3)</text><text x="110" y="544" class="text">7</text><text x="150" y="544" class="small">blanco/marrón  (par 4)</text><text x="110" y="568" class="text">8</text><text x="150" y="568" class="small">marrón              (par 4)</text>
<text x="470" y="360" class="text" font-weight="bold">Equipos y cable a usar</text>
<rect x="470" y="380" width="330" height="220" rx="8" fill="#fff" stroke="#e67e22" stroke-width="2"/>
<text x="490" y="410" class="small">PC &#8594; Switch:  directo</text>
<text x="490" y="438" class="small">PC &#8594; PC:      cruzado</text>
<text x="490" y="466" class="small">PC &#8594; Toma de pared:  directo</text>
<text x="490" y="494" class="small">Switch &#8594; Switch:  cruzado</text>
<text x="490" y="522" class="small">Switch &#8594; Router:  directo</text>
<text x="490" y="550" class="small">Hoy los equipos modernos (Auto-MDIX)</text>
<text x="490" y="568" class="small">detectan solos el tipo de cable.</text>
</svg>