<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />
  
  <!-- Science & Math Graphics -->
  <g filter="url(#shadow)">
    <!-- Atom Orbit -->
    <ellipse cx="256" cy="200" rx="150" ry="55" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="8" transform="rotate(-30 256 200)" />
    <ellipse cx="256" cy="200" rx="150" ry="55" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="8" transform="rotate(30 256 200)" />
    <circle cx="256" cy="200" r="14" fill="#38bdf8" />
    
    <!-- Lab Flask -->
    <path d="M236 120 L276 120 L276 170 L330 270 A20 20 0 0 1 312 300 L200 300 A20 20 0 0 1 182 270 L236 170 Z" fill="rgba(255,255,255,0.95)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    <!-- Liquid inside flask -->
    <path d="M205 255 L307 255 L312 270 A20 20 0 0 1 296 294 L216 294 A20 20 0 0 1 200 270 Z" fill="#10b981" />
    <circle cx="240" cy="275" r="5" fill="#ffffff" opacity="0.8" />
    <circle cx="265" cy="265" r="7" fill="#ffffff" opacity="0.8" />
    <circle cx="250" cy="235" r="4" fill="#ffffff" opacity="0.8" />
    
    <!-- Math symbols -->
    <text x="85" y="150" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="bold" fill="rgba(255,255,255,0.85)">π</text>
    <text x="385" y="150" font-family="'JetBrains Mono', monospace" font-size="52" font-weight="bold" fill="rgba(255,255,255,0.85)">∑</text>
    <text x="80" y="320" font-family="'JetBrains Mono', monospace" font-size="50" font-weight="bold" fill="rgba(255,255,255,0.85)">√x</text>
    <text x="375" y="320" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="bold" fill="rgba(255,255,255,0.85)">∞</text>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="94" font-weight="900" fill="#ffffff" letter-spacing="2">CA1</text>
  <text x="256" y="456" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#a7f3d0" letter-spacing="4">CIÈNCIES APLICADES</text>
</svg>
