theme: jekyll-theme-cayman
title: Portal Docent d'Informàtica
description: Documentació tècnica, apunts i recursos dels mòduls de Formació Professional en Informàtica
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
